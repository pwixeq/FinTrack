
<header class="navbar navbar-expand-md d-print-none">
    <div class="container-xl">

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbar-menu"
                aria-controls="navbar-menu"
                aria-expanded="false"
                aria-label="Открыть меню">
            <span class="navbar-toggler-icon"></span>
        </button>

        <a class="navbar-brand navbar-brand-autodark" href="/">
            <span class="text-primary fw-bold">Fin</span>Track
        </a>


<div class="navbar-nav flex-row order-md-last align-items-center gap-2">

    <div class="d-flex align-items-center">
        <button class="btn btn-outline-primary"
                id="theme-toggle"
                type="button">
            Сменить тему
        </button>
    </div>

    {% if user.is_authenticated %}
        <div class="d-flex align-items-center gap-2">
            <span class="text-secondary d-none d-lg-inline">
                {{ user.username }}
            </span>
                    <a href="{% url 'profile' %}" class="btn btn-outline-primary btn-sm">
                        Мой профиль
                    </a>
            <form method="post"
                  action="{% url 'logout' %}"
                  class="m-0">
                {% csrf_token %}
                <button class="btn btn-outline-danger" type="submit">
                    Выйти
                </button>
            </form>
        </div>
    {% else %}
        <div class="d-flex align-items-center gap-2">
            <a class="btn btn-outline-primary" href="{% url 'login' %}">
                Войти
            </a>
            <a class="btn btn-primary" href="{% url 'register' %}">
                Регистрация
            </a>
        </div>
    {% endif %}

</div>


        <div class="collapse navbar-collapse" id="navbar-menu">
            <div class="navbar-nav">
                <a class="nav-link" href="/">Главная</a>
                <a class="nav-link" href="/transactions/">Операции</a>
                <a class="nav-link" href="/categories/">Категории</a>
                <a class="nav-link" href="/budgets/">Бюджеты</a>
                <a class="nav-link" href="{% url 'profile' %}">Профиль</a>
            </div>
        </div>

    </div>
</header>
