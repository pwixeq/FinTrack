
{% extends 'base.html' %}

{% block title %}Вход | FinTrack{% endblock %}

{% block content %}
<div class="container container-tight py-4">
    <div class="card card-md">
        <div class="card-body">
            <h2 class="h2 text-center mb-4">Вход в FinTrack</h2>

            <form method="post">
                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="btn btn-primary w-100">
                    Войти
                </button>
            </form>

            <div class="text-center mt-3">
                Нет аккаунта?
                <a href="{% url 'register' %}">Зарегистрироваться</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
